appId: com.popmail.app
productName: PopMail
copyright: Copyright © 2026 PopMail

directories:
  output: dist-desktop

extraMetadata:
  name: popmail
  version: 1.0.0
  description: PopMail — a fast, lightweight AI mail client
  main: electron/main.js
  author: PopMail

files:
  - electron/**/*

extraResources:
  - from: desktop/app
    to: app-server

win:
  target: nsis
  icon: electron/icon.png
  artifactName: PopMail-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PopMail

asar: true
